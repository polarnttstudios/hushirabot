<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Login — Dashboard do Bot</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <form class="login-card" id="loginForm">
      <h1>🔒 Painel do Bot</h1>
      <p>Acesso restrito — apenas usuários autorizados.</p>
      <div class="error-msg" id="errorMsg"></div>
      <input type="text" id="user" placeholder="Usuário" autocomplete="username" required />
      <input type="password" id="password" placeholder="Senha" autocomplete="current-password" required />
      <button type="submit" style="width:100%">Entrar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const user = document.getElementById('user').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user, password }),
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = '/dashboard.html';
      } else {
        errorMsg.textContent = data.error || 'Erro ao entrar';
      }
    });
  </script>
</body>
</html>
